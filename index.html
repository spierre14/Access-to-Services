<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access to Services Index</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<div class="map-loading" id="mapLoading">Loading data&hellip;</div>

<!-- service picker -->
<div class="control-panel">
  <div class="control-title">Access to Services Index</div>
  <select id="serviceSelect" class="service-select">
    <option value="combined">Combined (all services)</option>
    <option value="atm">ATM</option>
    <option value="daycare">Daycare</option>
    <option value="grocery">Grocery / Supermarket</option>
    <option value="laundry">Laundry</option>
    <option value="library">Library</option>
    <option value="park">Park</option>
    <option value="pharmacy">Pharmacy</option>
    <option value="postoffice">Post Office</option>
  </select>

  <div class="toggle-divider"></div>
  <div class="toggle-label">Show locations</div>
  <div id="toggleList" class="toggle-list">
    <!-- populated by js/app.js: one checkbox per service, all off by default -->
  </div>
</div>

<!-- legend -->
<div class="legend-panel" id="legend">
  <!-- populated by js/app.js based on the selected service -->
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
